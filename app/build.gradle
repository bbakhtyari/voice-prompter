plugins {
    id 'com.android.application'
}

android {
    namespace 'com.voiceprompter.fa'
    compileSdk 34

    defaultConfig {
        applicationId "com.voiceprompter.fa"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "1.1"
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    // One fixed key for every build, so a new APK installs over the old one.
    signingConfigs {
        shared {
            storeFile rootProject.file('keystore/voiceprompter.p12')
            storeType 'PKCS12'
            storePassword 'voiceprompter'
            keyAlias 'voiceprompter'
            keyPassword 'voiceprompter'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.shared
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.shared
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    androidResources {
        noCompress 'zip'
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    lint {
        abortOnError = false
        checkReleaseBuilds = false
    }
}

dependencies {
    implementation 'net.java.dev.jna:jna:5.13.0@aar'
    implementation 'com.alphacephei:vosk-android:0.3.47@aar'
}
