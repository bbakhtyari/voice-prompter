plugins {
    id 'com.android.application'
}

// The Shenava engine needs the sherpa-onnx library. When its AAR has been placed
// in app/libs (the GitHub workflow does this) the real decoder is compiled in;
// otherwise a stand-in is used and the app offers Vosk only.
def hasSherpa = file('libs/sherpa-onnx.aar').exists()

android {
    namespace 'com.voiceprompter.fa'
    compileSdk 34

    defaultConfig {
        applicationId "com.voiceprompter.fa"
        minSdk 26
        targetSdk 34
        versionCode 4
        versionName "1.3"
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    // One fixed key for every build, so a new APK installs over the old one.
    signingConfigs {
        shared {
            storeFile rootProject.file('keystore/voiceprompter.p12')
            storeType 'PKCS12'
            storePassword 'voiceprompter'
            keyAlias 'voiceprompter'
            keyPassword 'voiceprompter'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.shared
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.shared
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            java.srcDirs += hasSherpa ? 'src/sherpa/java' : 'src/nosherpa/java'
        }
    }

    androidResources {
        noCompress 'zip', 'onnx'
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
            pickFirsts += ['**/libc++_shared.so']
        }
    }

    lint {
        abortOnError = false
        checkReleaseBuilds = false
    }
}

dependencies {
    implementation 'net.java.dev.jna:jna:5.13.0@aar'
    implementation 'com.alphacephei:vosk-android:0.3.47@aar'
    if (hasSherpa) {
        implementation files('libs/sherpa-onnx.aar')
        // the library's classes are written in Kotlin
        implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'
    }
}
