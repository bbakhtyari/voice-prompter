name: Build APK

on:
  push:
    branches: [main, master, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The Persian speech model (about 50 MB) is packed into the APK so the
      # tablet needs no internet. If the download fails the build still
      # succeeds and the app asks for the model zip on first start.
      - name: Download Persian speech model
        run: |
          mkdir -p app/src/main/assets
          if curl -fL --retry 3 --retry-delay 5 -o app/src/main/assets/model-fa.zip "$MODEL_URL" \
             && unzip -tq app/src/main/assets/model-fa.zip > /dev/null; then
            ls -lh app/src/main/assets/model-fa.zip
          else
            rm -f app/src/main/assets/model-fa.zip
            echo "::warning::Persian model could not be downloaded; APK is built without it."
          fi
        env:
          MODEL_URL: https://alphacephei.com/vosk/models/vosk-model-small-fa-0.42.zip

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Rename
        run: cp app/build/outputs/apk/release/app-release.apk VoicePrompterFa.apk

      # ---- second APK: the same app plus the Shenava engine -----------------
      # Needs the sherpa-onnx library and the Shenava models; if anything here
      # fails, the normal APK above is still published.
      - name: Fetch sherpa-onnx and Shenava models
        id: shenava
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p app/libs
          got=""
          for v in 2.0.1 1.13.8; do
            if curl -fL --retry 3 -o app/libs/sherpa-onnx.aar \
                 "https://github.com/k2-fsa/sherpa-onnx/releases/download/v$v/sherpa-onnx-$v.aar"; then
              got=$v; break
            fi
          done
          test -n "$got" || { rm -f app/libs/sherpa-onnx.aar; echo "sherpa-onnx AAR not found"; exit 1; }
          echo "sherpa-onnx $got"
          unzip -l app/libs/sherpa-onnx.aar | grep -E "\.so|classes.jar"
          python3 -m pip install -q onnx onnxruntime huggingface_hub sherpa-onnx numpy
          python3 tools/prepare_shenava.py
          ls -lh app/src/main/assets/shenava-*/

      - name: Check the Shenava models on real Persian speech
        if: steps.shenava.outcome == 'success'
        continue-on-error: true
        run: |
          python3 -m pip install -q soundfile requests
          python3 tools/check_shenava.py

      - name: Build the Shenava APK
        id: shenava_apk
        if: steps.shenava.outcome == 'success'
        continue-on-error: true
        run: |
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk VoicePrompterFa-shenava.apk
          ls -lh *.apk

      - name: Remove a half-fetched library
        if: steps.shenava.outcome != 'success'
        run: rm -f app/libs/sherpa-onnx.aar

      - uses: actions/upload-artifact@v4
        with:
          name: VoicePrompterFa
          path: "*.apk"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: |
            VoicePrompterFa.apk
            VoicePrompterFa-shenava.apk
